name: "Jev for WhatsApp"
description: "Open-source Android reply copilot for WhatsApp. It reads the chat on screen, uses your OpenRouter key to judge intent and risk, drafts two replies, and fills the one you pick into the message box. You press send. Not affiliated with WhatsApp."
